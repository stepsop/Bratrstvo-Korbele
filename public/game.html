                    <button onclick="closeSquadModal()">${uiIcon("beer", "ui-icon-xs")} \u0417\u0430 \u0441\u0442\u043E\u043B \u0432 \u0442\u0430\u0432\u0435\u0440\u043D\u0443 (\u0417\u0430\u043A\u0440\u044B\u0442\u044C)</button>
                </div>
            </div>
        `;
      CanvasRendererView.drawNpcAvatar("host");
    }
    renderSmithDialog(state) {
      this.openOverlay();
      const forgeTier = GameDataCatalog.getForgeTier(state.tavernUpgrades);
      const craftBonus = GameDataCatalog.getForgeCraftBonus(state.tavernUpgrades);
      const activeFilter = state.smithMenuState.filter || "all";
      const metalKeys = ["iron", "bronze", "steel", "damask"];
      const metalStockHtml = metalKeys.map((m) => {
        const meta = GameDataCatalog.METAL_META[m];
        const amt = state.metals[m] || 0;
        return `
                <div class="smith-metal-pill metal-${m}" title="${meta.desc}">
                    <span class="smith-metal-icon">${uiIcon(meta.icon, "ui-icon-xs")}</span>
                    <span class="smith-metal-name">${meta.name}:</span>
                    <b class="smith-metal-val">${amt}</b>
                </div>
            `;
      }).join("");
      const smeltListHtml = state.spareEquip.length === 0 ? `
                <div class="smith-empty-state">
                    ${uiIcon("pouch", "ui-icon-lg")}
                    <div>\u041D\u0430 \u0441\u043A\u043B\u0430\u0434\u0435 \u043E\u0442\u0440\u044F\u0434\u0430 \u043D\u0435\u0442 \u043B\u0438\u0448\u043D\u0435\u0439 \u0430\u043C\u0443\u043D\u0438\u0446\u0438\u0438 \u0434\u043B\u044F \u043F\u0435\u0440\u0435\u043F\u043B\u0430\u0432\u043A\u0438.</div>
                    <div class="smith-empty-sub">\u041F\u0440\u0438\u043D\u0435\u0441\u0438\u0442\u0435 \u0442\u0440\u043E\u0444\u0435\u0438 \u0438\u0437 \u043F\u043E\u0445\u043E\u0434\u043E\u0432 \u0438\u043B\u0438 \u0441\u043D\u0438\u043C\u0438\u0442\u0435 \u0441\u0442\u0430\u0440\u043E\u0435 \u0441\u043D\u0430\u0440\u044F\u0436\u0435\u043D\u0438\u0435 \u0441 \u0431\u043E\u0439\u0446\u0430 \u0432 \u043C\u0435\u043D\u044E \u041E\u0422\u0420\u042F\u0414.</div>
                </div>
            ` : state.spareEquip.map((item, idx) => {
        const yieldMap = GameDataCatalog.getSmeltYield(item, forgeTier);
        const statsParts = [];
        if (item.atk > 0) statsParts.push(`+${item.atk} \u0423\u0440`);
        if (item.armor > 0) statsParts.push(`+${item.armor} \u0411\u0440`);
        if (item.block > 0) statsParts.push(`+${item.block}% \u0411\u043B\u043E\u043A`);
        const yieldHtml = metalKeys.filter((m) => (yieldMap[m] || 0) > 0).map((m) => {
          const meta = GameDataCatalog.METAL_META[m];
          return `<span class="smith-yield-tag metal-${m}">${uiIcon(meta.icon, "ui-icon-xs")} +${yieldMap[m]} ${meta.short}</span>`;
        }).join("");
        return `
                    <div class="smith-item-card ${item.getRarityClass()}">
                        <div class="smith-item-main">
                            <div class="smith-item-icon">${uiIcon(item.getIcon(), "ui-icon-md")}</div>
                            <div class="smith-item-info">
                                <div class="smith-item-title">${item.name}</div>
                                <div class="smith-item-sub">${item.getSlotCleanName()} \u2022 ${statsParts.join(", ") || "\u0411\u0435\u0437 \u0431\u043E\u043D\u0443\u0441\u043E\u0432"}</div>
                                <div class="smith-yield-row">${yieldHtml}</div>
                            </div>
                        </div>
                        <button class="smith-action-btn smelt-btn" onclick="smeltSpareItem(${idx})">
                            ${uiIcon("fire", "ui-icon-xs")} \u0420\u0430\u0441\u043F\u043B\u0430\u0432\u0438\u0442\u044C
                        </button>
                    </div>
                `;
      }).join("");
      const recipes = GameDataCatalog.createSmithingRecipes().filter(
        (r) => activeFilter === "all" ? true : r.slot === activeFilter
      );
      const slotLabels = {
        weapon: "\u041E\u0440\u0443\u0436\u0438\u0435",
        armor: "\u0411\u0440\u043E\u043D\u044F",
        trinket: "\u0422\u0430\u043B\u0438\u0441\u043C\u0430\u043D"
      };
      const recipesHtml = recipes.map((rec) => {
        const bonusAtk = rec.slot === "weapon" ? craftBonus.atk : 0;
        const bonusArmor = rec.slot === "armor" ? craftBonus.armor : 0;
        const bonusBlock = rec.slot === "trinket" ? craftBonus.block : 0;
        const totalAtk = rec.atk + bonusAtk;
        const totalArmor = rec.armor + bonusArmor;
        const totalBlock = rec.block + bonusBlock;
        const statChips = [];
        if (totalAtk > 0) statChips.push(`+${totalAtk} \u0423\u0440${bonusAtk > 0 ? ` (+${bonusAtk})` : ""}`);
        if (totalArmor > 0) statChips.push(`+${totalArmor} \u0411\u0440${bonusArmor > 0 ? ` (+${bonusArmor})` : ""}`);
        if (totalBlock > 0) statChips.push(`+${totalBlock}% \u0411\u043B\u043E\u043A${bonusBlock > 0 ? ` (+${bonusBlock}%)` : ""}`);
        let canCraft = true;
        const costTagsHtml = metalKeys.filter((m) => (rec.cost[m] || 0) > 0).map((m) => {
          const need = rec.cost[m] || 0;
          const have = state.metals[m] || 0;
          const ok = have >= need;
          if (!ok) canCraft = false;
          const meta = GameDataCatalog.METAL_META[m];
          return `<span class="smith-cost-tag ${ok ? "cost-ok" : "cost-low"}">${uiIcon(meta.icon, "ui-icon-xs")} ${meta.name}: ${have}/${need}</span>`;
        }).join("");
        return `
                <div class="smith-recipe-card">
                    <div class="smith-recipe-top">
                        <div class="smith-item-icon">${uiIcon(rec.icon, "ui-icon-md")}</div>
                        <div class="smith-recipe-info">
                            <div class="smith-item-title">${rec.name} <span class="smith-slot-label">\u2022 ${slotLabels[rec.slot]}</span></div>
                            <div class="smith-recipe-stats">${statChips.join(" &nbsp;|&nbsp; ")}</div>
                            <div class="smith-recipe-desc">${rec.desc}</div>
                        </div>
                        <button class="smith-action-btn craft-btn" onclick="craftSmithRecipe('${rec.id}')" ${!canCraft ? "disabled" : ""}>
                            ${uiIcon("smith_hammer", "ui-icon-xs")} \u0412\u044B\u043A\u043E\u0432\u0430\u0442\u044C
                        </button>
                    </div>
                    <div class="smith-cost-row">
                        <span class="smith-cost-label">\u041C\u0435\u0442\u0430\u043B\u043B:</span> ${costTagsHtml}
                    </div>
                </div>
            `;
      }).join("");
      const upgradeBadgeHtml = forgeTier > 0 ? `<div class="smith-status-badge active">${uiIcon("check", "ui-icon-xs")} \u041A\u0443\u0437\u043D\u0438\u0446\u0430 (\u0421\u0442\u0443\u043F. ${forgeTier}): +${craftBonus.atk} \u043A \u043A\u043E\u0432\u043A\u0435${forgeTier >= 2 ? ", +\u043F\u043B\u0430\u0432\u043A\u0430" : ""}</div>` : `<div class="smith-status-badge test">${uiIcon("forge", "ui-icon-xs")} \u041F\u043E\u043B\u0435\u0432\u043E\u0439 \u0433\u043E\u0440\u043D (\u0412\u0435\u0442\u043A\u0430 \xABIV. \u041A\u0443\u0437\u043D\u0438\u0446\u0430\xBB \u0443 \u0425\u043E\u0437\u044F\u0438\u043D\u0430 \u0434\u0430\u0441\u0442 \u0431\u043E\u043D\u0443\u0441\u044B)</div>`;
      this.modalContent.innerHTML = `
            <div class="npc-dialog-box smith-modal-wrapper">
                <div class="npc-header-flex">
                    <canvas class="npc-avatar-canvas" id="npc-avatar" width="72" height="72"></canvas>
                    <div class="npc-quote-block">
                        <h3>\u041A\u0443\u0437\u043D\u0435\u0446 \u041C\u0430\u0442\u0435\u0439 \u2014 \u041A\u0443\u0437\u043D\u0438\u0446\u0430 \u0433\u0438\u043B\u044C\u0434\u0438\u0438</h3>
                        <div class="npc-quote-speech">${state.smithMenuState.speech}</div>
                    </div>
                    <button class="quest-close-btn" onclick="closeSquadModal()">${uiIcon("close", "ui-icon-xs")}</button>
                </div>

                <div class="smith-top-bar">
                    <div class="smith-metals-row">${metalStockHtml}</div>
                    ${upgradeBadgeHtml}
                </div>

                <div class="smith-grid">
                    <div class="smith-col">
                        <div class="smith-col-header">
                            <span>${uiIcon("fire", "ui-icon-sm")} \u041F\u041B\u0410\u0412\u041A\u0410 \u0421\u041D\u0410\u0420\u042F\u0416\u0415\u041D\u0418\u042F</span>
                            <span class="smith-col-count">\u041D\u0430 \u0441\u043A\u043B\u0430\u0434\u0435: ${state.spareEquip.length}</span>
                        </div>
                        <div class="smith-scroll-list">
                            ${smeltListHtml}
                        </div>
                    </div>

                    <div class="smith-col">
                        <div class="smith-col-header">
                            <span>${uiIcon("anvil", "ui-icon-sm")} \u041A\u041E\u0412\u041A\u0410 \u041F\u041E \u0420\u0415\u0426\u0415\u041F\u0422\u0410\u041C</span>
                            <div class="smith-filter-row">
                                <button class="smith-filter-btn ${activeFilter === "all" ? "active" : ""}" onclick="setSmithRecipeFilter('all')">\u0412\u0441\u0435</button>
                                <button class="smith-filter-btn ${activeFilter === "weapon" ? "active" : ""}" onclick="setSmithRecipeFilter('weapon')">\u041E\u0440\u0443\u0436\u0438\u0435</button>
                                <button class="smith-filter-btn ${activeFilter === "armor" ? "active" : ""}" onclick="setSmithRecipeFilter('armor')">\u0411\u0440\u043E\u043D\u044F</button>
                                <button class="smith-filter-btn ${activeFilter === "trinket" ? "active" : ""}" onclick="setSmithRecipeFilter('trinket')">\u0422\u0430\u043B\u0438\u0441\u043C\u0430\u043D</button>
                            </div>
                        </div>
                        <div class="smith-scroll-list">
                            ${recipesHtml}
                        </div>
                    </div>
                </div>
            </div>
        `;
      CanvasRendererView.drawNpcAvatar("smith");
    }
  };

  // src/views/CombatHudView.ts
  var CombatHudView = class {
    constructor() {
      this.logEl = document.getElementById("log-container");
      this.controlsEl = document.getElementById("controls");
    }
    appendLog(msg, faction = "system") {
      const prev = this.logEl.querySelectorAll(".log-entry");
      prev.forEach((el) => {
        el.classList.remove("log-latest");
        el.classList.add("log-old");
      });
      const badgeMap = {
        ally: { label: `${uiIcon("crossed_swords", "ui-icon-xs")} \u0421\u041E\u042E\u0417\u041D\u0418\u041A`, cls: "log-badge-ally" },
        enemy: { label: `${uiIcon("skull", "ui-icon-xs")} \u0412\u0420\u0410\u0413`, cls: "log-badge-enemy" },
        system: { label: `${uiIcon("scroll", "ui-icon-xs")} \u0411\u041E\u0419`, cls: "log-badge-system" }
      };
      const badge = badgeMap[faction] || badgeMap.system;
      const div = document.createElement("div");
      div.className = `log-entry log-${faction} log-latest`;
      div.innerHTML = `<span class="log-badge ${badge.cls}">${badge.label}</span><span class="log-text">${msg}</span>`;
      this.logEl.appendChild(div);
      this.logEl.scrollTop = this.logEl.scrollHeight;
    }
    clearLog() {
      this.logEl.innerHTML = "";
    }
    renderCombatControls(state) {
      const combat = state.combat;
      if (!combat.active) return;
      const psaLabel = combat.psaKrevCd > 0 ? `${uiIcon("fire", "ui-icon-sm")} \u041F\u0441\u044F \u043A\u0440\u0435\u0432! [\u041A\u0414: ${combat.psaKrevCd} \u0445.]` : `${uiIcon("fire", "ui-icon-sm")} \u041F\u0421\u042F \u041A\u0420\u0415\u0412! (+10 \u0412\u0440\u0435\u043C.HP \u0438 +2 \u0423\u0440\u043E\u043D \u043D\u0430 6 \u0445.)`;
      let selectedHeroPanel = "";
      if (combat.paused && combat.selectedHeroId) {
        const sh = state.party.find((p) => p.id === combat.selectedHeroId);
        if (sh) {
          const orderNames = {
            "skill1_first": `\u041F\u0440\u0438\u043E\u0440\u0438\u0442\u0435\u0442 1-\u0439 (\xAB${sh.skill1Name}\xBB), \u0432 \u041A\u0414 \u2014 2-\u044F`,
            "basic_only": `\u0422\u043E\u043B\u044C\u043A\u043E 2-\u044F \u0431\u0430\u0437\u043E\u0432\u0430\u044F (\xAB${sh.skill2Name}\xBB)`,
            "alternate": `\u0427\u0435\u0440\u0435\u0434\u043E\u0432\u0430\u0442\u044C 1-\u044E \u0438 2-\u044E \u0441\u043F\u043E\u0441\u043E\u0431\u043D\u043E\u0441\u0442\u044C`
          };
          const targetNames = {
            "focus_or_random": "\u041F\u043E \u0444\u043E\u043A\u0443\u0441\u0443 \u041C\u0430\u0441\u0442\u0435\u0440\u0430 / \u0421\u043B\u0443\u0447\u0430\u0439\u043D\u044B\u0439 \u0432\u0440\u0430\u0433",
            "lowest_hp": "\u0414\u043E\u0431\u0438\u0432\u0430\u0442\u044C \u0441\u0430\u043C\u043E\u0433\u043E \u0440\u0430\u043D\u0435\u043D\u043E\u0433\u043E \u0432\u0440\u0430\u0433\u0430",
            "highest_hp": "\u0411\u0438\u0442\u044C \u0441\u0430\u043C\u043E\u0433\u043E \u0437\u0434\u043E\u0440\u043E\u0432\u043E\u0433\u043E \u0432\u0440\u0430\u0433\u0430"
          };
          selectedHeroPanel = `
                    <div class="btn-row combat-center-row" style="background:#261a10; padding:5px 10px; border:1px solid #ffd700; max-width:740px; margin:2px auto 0 auto;">
                        <div style="width:100%; font-size:11px; color:#ffd700; margin-bottom:3px; text-align:center;">
                            ${uiIcon("gear", "ui-icon-xs")} <b>\u0420\u0430\u0441\u043F\u043E\u0440\u044F\u0434\u043E\u043A (${sh.name}):</b> 1) ${sh.skill1Name} [\u041A\u0414:${sh.cd1}/${sh.maxCd1}] | 2) ${sh.skill2Name} [\u041A\u0414:${sh.cd2}/${sh.maxCd2}]
                        </div>
                        <button onclick="cycleHeroSkillOrder('${sh.id}')">${uiIcon("swap_h", "ui-icon-xs")} \u041F\u043E\u0440\u044F\u0434\u043E\u043A \u0430\u0442\u0430\u043A: ${orderNames[sh.skillOrder]}</button>
                        <button onclick="cycleHeroTargetRule('${sh.id}')">${uiIcon("eye", "ui-icon-xs")} \u0412\u044B\u0431\u043E\u0440 \u0446\u0435\u043B\u0438: ${targetNames[sh.targetRule]}</button>
                    </div>
                `;
        }
      } else {
        const hintText = combat.paused ? `${uiIcon("hourglass", "ui-icon-xs")} <b>\u0422\u0410\u041A\u0422\u0418\u0427\u0415\u0421\u041A\u0410\u042F \u041F\u0410\u0423\u0417\u0410:</b> \u043A\u043B\u0438\u043A\u043D\u0438\u0442\u0435 \u043A\u0443\u0440\u0441\u043E\u0440\u043E\u043C \u043F\u043E \u0433\u0435\u0440\u043E\u044E \u043D\u0430 \u043F\u043E\u043B\u0435 \u0431\u043E\u044F \u0434\u043B\u044F \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 \u0435\u0433\u043E \u0440\u0430\u0441\u043F\u043E\u0440\u044F\u0434\u043A\u0430, \u0438\u043B\u0438 \u043D\u0430\u0436\u043C\u0438\u0442\u0435 <b>[\u041F\u0420\u041E\u0411\u0415\u041B]</b> \u0434\u043B\u044F \u043F\u0440\u043E\u0434\u043E\u043B\u0436\u0435\u043D\u0438\u044F \u0431\u043E\u044F.` : `${uiIcon("scroll", "ui-icon-xs")} \u041D\u0430\u0436\u043C\u0438\u0442\u0435 <b>[\u041F\u0420\u041E\u0411\u0415\u041B]</b> \u0434\u043B\u044F \u0442\u0430\u043A\u0442\u0438\u0447\u0435\u0441\u043A\u043E\u0439 \u043F\u0430\u0443\u0437\u044B \u0438 \u0432\u044B\u0431\u043E\u0440\u0430 \u0431\u043E\u0439\u0446\u0430 \u043A\u0443\u0440\u0441\u043E\u0440\u043E\u043C | ${uiIcon("beer", "ui-icon-xs")} \u0410\u0432\u0442\u043E-\u043F\u0438\u0432\u043E (\u043F\u0440\u0438 \u226430% HP \u0438\u043B\u0438 \u043A\u0440\u0438\u0442. \u0443\u0434\u0430\u0440\u0435): <b>${state.beer} \u0448\u0442.</b>`;
        selectedHeroPanel = `
                <div style="text-align:center; font-size:11px; color:#c8b08a; margin-top:2px;">
                    ${hintText}
                </div>
            `;
      }
      this.controlsEl.innerHTML = `
            <div class="btn-row combat-center-row">
                <button class="btn-psakrev combat-spec-btn" onclick="usePsaKrev()" ${combat.psaKrevCd > 0 ? "disabled" : ""}>${psaLabel}</button>
                <button class="combat-spec-btn" onclick="useMasterPot()" ${state.pots <= 0 ? "disabled" : ""}>${uiIcon("barrel", "ui-icon-sm")} \u0428\u0422\u0423\u0420\u041C\u041E\u0412\u041E\u0419 \u0413\u041E\u0420\u0428\u041E\u041A (1d20) [${state.pots}]</button>
            </div>
            ${selectedHeroPanel}
        `;
    }
    renderVictoryControls() {
      this.controlsEl.innerHTML = `
            <div class="btn-row">
                <button onclick="returnFromCombat()">${uiIcon("beer", "ui-icon-sm")} \u0417\u0430\u0431\u0440\u0430\u0442\u044C \u0434\u043E\u0431\u044B\u0447\u0443 \u0438 \u043F\u0440\u043E\u0434\u043E\u043B\u0436\u0438\u0442\u044C \u043F\u0443\u0442\u044C</button>
            </div>
        `;
    }
    renderDefeatControls() {
      this.controlsEl.innerHTML = `
            <div class="btn-row">
                <button onclick="enterGuild(true)">${uiIcon("tavern", "ui-icon-sm")} \u0412\u0435\u0440\u043D\u0443\u0442\u044C\u0441\u044F \u0432 \u0442\u0430\u0432\u0435\u0440\u043D\u0443 Bratrstvo Korbele</button>
            </div>
        `;
    }
  };

  // src/presenters/SquadPresenter.ts
  var SquadPresenter = class {
    constructor(state, view, topBarView, hudView) {
      this.state = state;
      this.view = view;
      this.topBarView = topBarView;
      this.hudView = hudView;
    }
    openSquadModal(heroId = null) {
      if (!heroId) {
        this.renderSquadListModal();
      } else {
        this.renderHeroDetailModal(heroId);
      }
    }
    closeSquadModal() {
      this.view.hideModal();
    }
    renderSquadListModal() {
      this.view.renderSquadList(this.state);
    }
    toggleSquadHero(heroId) {
      const h = this.state.party.find((p) => p.id === heroId);
      if (!h || h.status !== "ready") return;
      if (h.inSquad) {
        h.inSquad = false;

    /**

    checkAutoBeerForHero(hero, isCriticalWound = false) {
      if (this.state.beer <= 0 || hero.hp <= 0 || hero.status !== "ready") return;
      const lowHpThreshold = Math.ceil(hero.maxHp * 0.3);

      const heal = this.roll(10);

      const reason = isCriticalWound ? "\u043A\u0440\u0438\u0442\u0438\u0447\u0435\u0441\u043A\u043E\u0435 \u0440\u0430\u043D\u0435\u043D\u0438\u0435" : "\u226430% HP";
      this.state.addParticles(hero.x || 120, hero.y || 120, "#66ff66", 14);
      this.state.addFloatingText(`+${heal} \u0410\u0412\u0422\u041E-\u041F\u0418\u0412\u041E!`, hero.x || 120, (hero.y || 120) - 24, "#66ff66");
      this.hudView.appendLog(`<span class="hl-green">\u{1F37A} \u0410\u0412\u0422\u041E-\u041F\u0418\u0412\u041E (${reason}):</span> <b>${hero.name}</b> \u043E\u0441\u0443\u0448\u0430\u0435\u0442 \u043A\u0440\u0443\u0436\u043A\u0443 \u043F\u0438\u0432\u0430 \u0438 \u043B\u0435\u0447\u0438\u0442 <b>${heal} HP</b> (1d10)! [\u041E\u0441\u0442\u0430\u043B\u043E\u0441\u044C: ${this.state.beer}]`, "ally");

      this.state.combat.enemies.forEach((e) => {

    pickEnemyTargetForHero(hero) {
      const combat = this.state.combat;
      const alive = combat.enemies.map((e, i) => ({ target: e, index: i })).filter((x) => x.target.hp > 0);
      if (!alive.length) return null;
      if (combat.focusEnemyIndex !== null) {
        const fe = combat.enemies[combat.focusEnemyIndex];
        if (fe && fe.hp > 0) return { target: fe, index: combat.focusEnemyIndex };
      }
      if (hero.targetRule === "lowest_hp") {
        alive.sort((a, b) => a.target.hp - b.target.hp);
        return alive[0];
      }
      if (hero.targetRule === "highest_hp") {

    applyDamageToUnit(attacker, defender, rawDmg, isCriticalStrike = false) {

          this.hudView.appendLog(`<i>\u041D\u0435\u043F\u0440\u043E\u0441\u044B\u0445\u0430\u0435\u043C\u044B\u0439 \u0430\u043B\u043A\u0430\u0448 (50%):</i> \u041F\u0430\u043D \u0412\u0448\u0438\u0432\u0435\u0446 \u043C\u0430\u0436\u0435\u0442 \u0441\u043F\u044C\u044F\u043D\u0443! \u0418\u0441\u0445\u043E\u0434\u044F\u0449\u0438\u0439 \u0443\u0440\u043E\u043D = <b>0</b>.`, "ally");

      if (defender.tempHp && defender.tempHp > 0) {

            } else {
              const perEnemy = Math.max(1, Math.floor(totalRoll / aliveEnemies.length));
              this.hudView.appendLog(`<b>${hero.name}</b> \u0431\u044C\u0435\u0442 <span class="hl-gold">\xAB\u0410\u0442\u0430\u043A\u043E\u0439 \u043F\u043B\u0430\u0448\u043C\u044F\xBB</span> (${totalRoll} \u0443\u0440. \u0432 \u0441\u0443\u043C\u043C\u0435) \u2014 \u043F\u043E ${perEnemy} \u0443\u0440\u043E\u043D\u0430 \u0432\u0441\u0435\u043C \u0432\u0440\u0430\u0433\u0430\u043C!`, "ally");
              aliveEnemies.forEach((e) => {
                const prevHp = e.hp;
                e.hp = Math.max(0, e.hp - perEnemy);
                e.flash = 8;
                this.state.addFloatingText(`-${perEnemy}`, e.x, e.y - 15, "#ff8866");
                if (prevHp > 0 && e.hp === 0) {
                  this.recordEnemyKill(e, hero);
                }
              });
            }
          } else {
            hero.lastUsedSkill = 2;
            const d = this.roll(4) + bonus;
            this.hudView.appendLog(`<b>${hero.name}</b> \u0440\u0443\u0431\u0438\u0442 <i>\u043E\u0440\u0443\u0436\u0438\u0435\u043C</i> \u043F\u043E ${target.name} (${d} \u0443\u0440.).`, "ally");
            this.applyDamageToUnit(hero, target, d);
          }
        } else if (hero.cls === "\u0421\u0432\u044F\u0442\u043E\u0448\u0430") {
          const woundedAllies = this.state.party.filter((h) => h.inSquad && h.status === "ready" && h.hp > 0 && h.hp < h.maxHp);
          if (hero.shouldUsePrimarySkill(hero.cd2 <= 0 && woundedAllies.length > 0)) {
            hero.cd2 = hero.maxCd2;
            hero.lastUsedSkill = 1;
            woundedAllies.sort((a, b) => a.hp - b.hp);
            const ally = woundedAllies[0];
            const heal = this.roll(4);
            ally.hp = Math.min(ally.maxHp, ally.hp + heal);
            this.state.addFloatingText(`+${heal} HP`, ally.x, ally.y - 18, "#66ff66");
            this.hudView.appendLog(`<b>${hero.name}</b> \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0442 <span class="hl-green">\xAB\u0417\u0430\u043F\u0438\u0442\u044C \u0433\u0440\u0435\u0445\u0438\xBB</span> \u0438 \u043B\u0435\u0447\u0438\u0442 ${ally.name} \u043D\u0430 <b>${heal} HP</b>!`, "ally");
          } else {
            hero.lastUsedSkill = 2;
            const d = this.roll(4) + bonus;
            this.hudView.appendLog(`<b>${hero.name}</b> \u0431\u044C\u0435\u0442 <i>\u0434\u0443\u0431\u0438\u043D\u043E\u0439</i> ${target.name} \u043D\u0430 <b>${d} \u0443\u0440\u043E\u043D\u0430</b>.`, "ally");
            this.applyDamageToUnit(hero, target, d);
          }
        } else if (hero.cls === "\u041C\u0443\u0448\u043A\u0435\u0442\u0435\u0440") {
          if (hero.shouldUsePrimarySkill(hero.cd1 <= 0)) {
            hero.cd1 = hero.maxCd1;
            hero.lastUsedSkill = 1;
            const totalDmg = this.roll(10) + bonus;
            let neighbor = null;
            if (tIdx + 1 < combat.enemies.length && combat.enemies[tIdx + 1].hp > 0) neighbor = combat.enemies[tIdx + 1];
            else if (tIdx - 1 >= 0 && combat.enemies[tIdx - 1].hp > 0) neighbor = combat.enemies[tIdx - 1];
            if (!neighbor) {
              this.applyDamageToUnit(hero, target, totalDmg);
              this.hudView.appendLog(`<b>${hero.name}</b> \u0441\u0442\u0440\u0435\u043B\u044F\u0435\u0442 \u0438\u0437 <span class="hl-blue">\u0410\u0440\u043A\u0435\u0431\u0443\u0437\u044B</span> \u0432 ${target.name} \u043D\u0430 <b>${totalDmg} \u0443\u0440\u043E\u043D\u0430</b>!`, "ally");
            } else {
              const half1 = Math.ceil(totalDmg / 2);
              const half2 = Math.floor(totalDmg / 2);
              const overflow1 = Math.max(0, half1 - target.hp);
              this.applyDamageToUnit(hero, target, half1);
              const totalSecond = half2 + overflow1;
              const overflow2 = Math.max(0, totalSecond - neighbor.hp);
              this.applyDamageToUnit(hero, neighbor, totalSecond);
              if (overflow2 > 0 && target.hp > 0) this.applyDamageToUnit(hero, target, overflow2);
              this.hudView.appendLog(`<b>${hero.name}</b> \u0441\u0442\u0440\u0435\u043B\u044F\u0435\u0442 \u0438\u0437 <span class="hl-blue">\u0410\u0440\u043A\u0435\u0431\u0443\u0437\u044B</span> (${totalDmg} \u0443\u0440.) \u043F\u043E ${target.name} \u0438 ${neighbor.name}!`, "ally");
            }
          } else {
            hero.lastUsedSkill = 2;
            const d = this.roll(4) + bonus;
            this.hudView.appendLog(`<b>${hero.name}</b> \u043F\u044B\u0440\u044F\u0435\u0442 <i>\u043A\u043E\u0440\u0442\u0438\u043A\u043E\u043C</i> ${target.name} \u043D\u0430 <b>${d} \u0443\u0440\u043E\u043D\u0430</b>.`, "ally");
            this.applyDamageToUnit(hero, target, d);
          }
        }
      } else {
        const enemy = unit;
        const aliveHeroes = this.state.party.filter((h) => h.inSquad && h.status === "ready" && h.hp > 0);
        if (!aliveHeroes.length) return;
        const targetHero = aliveHeroes[Math.floor(Math.random() * aliveHeroes.length)];

        if (enemy.superCharge >= 3) {
          enemy.superCharge = 0;
          const rawSuper = this.roll(6) + 5;

            this.state.addFloatingText("\u0411\u041B\u041E\u041A \u0421\u0423\u041F\u0415\u0420-\u0423\u0414\u0410\u0420\u0410!", targetHero.x, targetHero.y - 22, "#66ccff");
            this.hudView.appendLog(`<span class="hl-blue">\u0411\u041B\u041E\u041A!</span> <b>${enemy.name}</b> \u043D\u0430\u043D\u043E\u0441\u0438\u0442 <b>\u0421\u0423\u041F\u0415\u0420-\u0423\u0414\u0410\u0420</b>, \u043D\u043E ${targetHero.name} \u0431\u043B\u043E\u043A\u0438\u0440\u0443\u0435\u0442 \u0435\u0433\u043E (${targetHero.blockChance}%)!`, "enemy");

            const finalDmg = Math.max(1, rawSuper - targetHero.armor);

            this.applyDamageToUnit(enemy, targetHero, finalDmg, true);
          }
        } else {
          const rawDmg = this.roll(enemy.atkSides);
          const finalDmg = Math.max(1, rawDmg - Math.floor(targetHero.armor / 2));
          this.hudView.appendLog(`<b>${enemy.name}</b> \u0430\u0442\u0430\u043A\u0443\u0435\u0442 ${targetHero.name} \u043D\u0430 <b>${finalDmg} \u0443\u0440\u043E\u043D\u0430</b>.`, "enemy");
          this.applyDamageToUnit(enemy, targetHero, finalDmg);
        }
      }
      this.hudView.renderCombatControls(this.state);
      this.checkCombatEnd();
    }
    checkCombatEnd() {
      const combat = this.state.combat;
      const enemiesAlive = combat.enemies.some((e) => e.hp > 0);
      const heroesAlive = this.state.party.some((h) => h.inSquad && h.status === "ready" && h.hp > 0);
      if (!enemiesAlive) {
        combat.active = false;
        const q = this.state.activeQuest;
        let rewardGold = 45 + this.roll(15);
        const rewardExp = !combat.isAmbush && q ? q.expReward : 10;
        if (combat.isAmbush) {
          rewardGold = 20 + this.roll(10);
        } else if (q) {
          rewardGold = q.goldReward;
        }
        this.state.gold += rewardGold;
        if (!combat.isAmbush) this.state.questsDone++;
        const rep = this.state.expeditionReport;
        if (!rep.hasReport) this.state.initExpeditionReport();
        rep.outcome = "victory";
        rep.battlesWon++;
        if (combat.isAmbush) rep.ambushFought = true;
        rep.goldEarned += rewardGold;
        this.state.party.filter((h) => h.inSquad && h.status === "ready" && h.hp > 0).forEach((h) => {
          h.tempHp = 0;
          h.exp += rewardExp;
          while (h.exp >= 20) {
            h.exp -= 20;
            h.talentPts++;
            h.maxHp += 3;
            h.hp += 3;
            rep.levelUps.push(`${h.name} (+1 \u0442\u0430\u043B.)`);
            this.hudView.appendLog(`<span class="hl-green">\u0411\u041E\u0415\u0412\u041E\u0419 \u041E\u041F\u042B\u0422!</span> ${h.name} \u043F\u043E\u043B\u0443\u0447\u0438\u043B +1 \u043E\u0447\u043A\u043E \u0442\u0430\u043B\u0430\u043D\u0442\u043E\u0432 (+3 \u041C\u0430\u043A\u0441. HP)! \u0418\u0437\u0443\u0447\u0438\u0442\u0435 \u0442\u0430\u043B\u0430\u043D\u0442 \u0434\u043B\u044F \u043F\u043E\u0432\u044B\u0448\u0435\u043D\u0438\u044F \u0443\u0440\u043E\u0432\u043D\u044F.`, "ally");
          }
        });
        let lootMsg = "";
        if (Math.random() < 0.7) {
          const trophyPool = [
            new EquipmentItem("\u0422\u0440\u043E\u0444\u0435\u0439\u043D\u044B\u0439 \u043A\u043B\u0435\u0432\u0435\u0446", "weapon", 2, 0, 5, "\u0422\u044F\u0436\u0435\u043B\u044B\u0439 \u0431\u043E\u0435\u0432\u043E\u0439 \u043A\u043B\u0435\u0432\u0435\u0446 \u0447\u0430\u0448\u043D\u0438\u043A\u043E\u0432. \u041F\u0440\u043E\u0431\u0438\u0432\u0430\u0435\u0442 \u0434\u043E\u0441\u043F\u0435\u0445\u0438: \u0434\u0430\u0451\u0442 +2 \u043A \u0443\u0440\u043E\u043D\u0443 \u0438 +5% \u043A \u0448\u0430\u043D\u0441\u0443 \u0431\u043B\u043E\u043A\u0430."),
            new EquipmentItem("\u0413\u0443\u0441\u0438\u0442\u0441\u043A\u0438\u0439 \u043F\u0430\u0432\u0435\u0437\u0430-\u0449\u0438\u0442", "armor", 0, 2, 10, "\u041E\u043A\u043E\u0432\u0430\u043D\u043D\u044B\u0439 \u043F\u0435\u0445\u043E\u0442\u043D\u044B\u0439 \u0449\u0438\u0442. \u0417\u0430\u0449\u0438\u0449\u0430\u0435\u0442 \u043E\u0442 \u0441\u0442\u0440\u0435\u043B \u0438 \u0446\u0435\u043F\u043E\u0432: \u0434\u0430\u0451\u0442 +2 \u043A \u0431\u0440\u043E\u043D\u0435 \u0438 +10% \u043A \u0448\u0430\u043D\u0441\u0443 \u0431\u043B\u043E\u043A\u0430."),
            new EquipmentItem("\u041F\u0435\u0440\u0441\u0442\u0435\u043D\u044C \u0441\u043E\u0442\u043D\u0438\u043A\u0430", "trinket", 1, 1, 5, "\u0411\u043E\u0433\u0430\u0442\u044B\u0439 \u0442\u0440\u043E\u0444\u0435\u0439\u043D\u044B\u0439 \u043F\u0435\u0440\u0441\u0442\u0435\u043D\u044C \u043A\u043E\u043C\u0430\u043D\u0434\u0438\u0440\u0430. \u041F\u043E\u0432\u044B\u0448\u0430\u0435\u0442 \u0431\u043E\u0435\u0432\u043E\u0439 \u0434\u0443\u0445: +1 \u043A \u0443\u0440\u043E\u043D\u0443, +1 \u043A \u0431\u0440\u043E\u043D\u0435, +5% \u043A \u0431\u043B\u043E\u043A\u0443.")
          ];
          const dropped = trophyPool[Math.floor(Math.random() * trophyPool.length)];
          this.state.spareEquip.push(dropped);
          const bonusParts = [];
          if (dropped.atk > 0) bonusParts.push(`+${dropped.atk} \u0423\u0440`);
          if (dropped.armor > 0) bonusParts.push(`+${dropped.armor} \u0411\u0440`);
          if (dropped.block > 0) bonusParts.push(`+${dropped.block}% \u0411\u043B\u043E\u043A`);
          const label = `${dropped.name} (${bonusParts.join(", ")})`;
          rep.lootItems.push(label);
          rep.lootObjects.push(dropped);
          lootMsg = ` \u0422\u0430\u043A\u0436\u0435 \u0434\u043E\u0431\u044B\u0442 <b>${label}</b> \u2014 \u0437\u0430\u0433\u043B\u044F\u043D\u0438\u0442\u0435 \u0432 \u043C\u0435\u043D\u044E \u041E\u0422\u0420\u042F\u0414!`;
        }
        this.hudView.appendLog(`<span class="hl-gold">\u041F\u041E\u0411\u0415\u0414\u0410!</span> \u0427\u0430\u0448\u043D\u0438\u043A\u0438 \u0440\u0430\u0437\u0431\u0438\u0442\u044B! \u041D\u0430\u0433\u0440\u0430\u0434\u0430: <b>${rewardGold} \u0433\u0440\u043E\u0448\u0435\u0439</b>.${lootMsg}`, "system");
        this.topBarView.renderStats(this.state);
        this.hudView.renderVictoryControls();
        return true;
      }
      if (!heroesAlive) {
        combat.active = false;
        const rep = this.state.expeditionReport;
        if (!rep.hasReport) this.state.initExpeditionReport();
        rep.outcome = "defeat";
        this.hudView.appendLog(`<span class="hl-red">\u041F\u041E\u0420\u0410\u0416\u0415\u041D\u0418\u0415!</span> \u041E\u0442\u0440\u044F\u0434 \u0440\u0430\u0437\u0431\u0438\u0442 \u0438 \u0441 \u043D\u043E\u0432\u044B\u043C\u0438 \u0448\u0438\u0448\u043A\u0430\u043C\u0438 \u043E\u0442\u0441\u0442\u0443\u043F\u0430\u0435\u0442 \u0432 \u0442\u0430\u0432\u0435\u0440\u043D\u0443...`, "system");
        this.state.party.forEach((h) => {
          if (h.inSquad && h.status === "ready") {
            h.hp = Math.max(6, Math.floor(h.maxHp * 0.4));
            h.tempHp = 0;
            h.injuries.push("\u041F\u043E\u0431\u0438\u0442 \u0446\u0435\u043F\u043E\u043C");
          }
        });
        this.hudView.renderDefeatControls();
        return true;
      }
      return false;
    }
    returnFromCombat() {
      this.state.scene = "map";
      this.state.mapState.encounterPending = null;
      if (!this.state.combat.isAmbush) {
        this.state.mapState.dir = "to_guild";
        this.state.mapState.progress = 0;
        this.state.mapState.ambushTriggered = false;
      }
      this.topBarView.updateSceneLayout(this.state);
    }
  };

  // src/presenters/GameLoopPresenter.ts
  var GameLoopPresenter = class {
    constructor(state, canvasView, hudView, squadPresenter, guildPresenter, combatPresenter) {
      this.state = state;
      this.canvasView = canvasView;
      this.hudView = hudView;
      this.squadPresenter = squadPresenter;
      this.guildPresenter = guildPresenter;
      this.combatPresenter = combatPresenter;
      this.bindCanvasEvents();
      this.bindWindowActions();
    }
    bindCanvasEvents() {
      const canvas = this.canvasView.canvas;
      window.addEventListener("keydown", (e) => {
        if ((e.code === "Space" || e.key === " ") && this.state.scene === "combat" && this.state.combat.active) {
          const modalOverlay = document.getElementById("modal-overlay");
          if (modalOverlay && modalOverlay.style.display === "flex") return;
          e.preventDefault();
          this.combatPresenter.togglePause();
        } else if ((e.code === "Space" || e.code === "Enter") && this.state.scene === "map" && this.state.mapState.encounterPending) {
          e.preventDefault();
          this.combatPresenter.confirmMapEncounter();
        }
      });
      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
        const my = (e.clientY - rect.top) * (canvas.height / rect.height);
        if (this.state.scene === "guild") {
          this.state.hoveredHotspot = null;
          for (const h of this.state.guildHotspots) {
            if (this.canvasView.hitTestHotspot(h, mx, my, this.state)) {
              this.state.hoveredHotspot = h;
              break;
            }
          }
          canvas.style.cursor = this.state.hoveredHotspot ? "pointer" : "default";
        } else if (this.state.scene === "combat" && this.state.combat.active) {
          const combat = this.state.combat;
          combat.hoveredHeroId = null;
          combat.hoveredEnemyIndex = null;
          let overInteractive = false;
          if (mx >= canvas.width - 48 && mx <= canvas.width - 12 && my >= 11 && my <= 47) {
            overInteractive = true;
          }
          combat.enemies.forEach((en, idx) => {
            if (en.hp > 0 && Math.abs(mx - en.x) < 28 && Math.abs(my - en.y) < 32) {
              combat.hoveredEnemyIndex = idx;
              overInteractive = true;
            }
          });
          this.state.party.filter((h) => h.inSquad && h.status === "ready").forEach((h) => {
            if (Math.abs(mx - h.x) < 28 && Math.abs(my - h.y) < 32) {
              combat.hoveredHeroId = h.id;
              overInteractive = true;
            }
          });
          canvas.style.cursor = overInteractive ? "pointer" : "default";
        } else {
          canvas.style.cursor = "default";
        }
      });
      canvas.addEventListener("mouseleave", () => {
        this.state.hoveredHotspot = null;
        this.state.combat.hoveredHeroId = null;
        this.state.combat.hoveredEnemyIndex = null;
      });
      const handleCanvasTap = (clientX, clientY) => {
        const rect = canvas.getBoundingClientRect();
        const mx = (clientX - rect.left) * (canvas.width / rect.width);
        const my = (clientY - rect.top) * (canvas.height / rect.height);
        if (this.state.scene === "guild") {
          let targetHotspot = this.state.hoveredHotspot;
          if (!targetHotspot) {
            for (const h of this.state.guildHotspots) {
              if (this.canvasView.hitTestHotspot(h, mx, my, this.state)) {
                targetHotspot = h;
                break;
              }
            }
          }
          if (targetHotspot) {
            this.state.hoveredHotspot = targetHotspot;
            this.guildPresenter.openGuildSection(targetHotspot.id);
          }
        } else if (this.state.scene === "combat" && this.state.combat.active) {
          if (mx >= canvas.width - 48 && mx <= canvas.width - 12 && my >= 11 && my <= 47) {
            this.combatPresenter.togglePause();
            return;
          }
          const activeHeroes = this.state.party.filter((h) => h.inSquad && h.status === "ready");
          for (const h of activeHeroes) {
            if (Math.abs(mx - h.x) < 28 && Math.abs(my - h.y) < 32) {
              this.combatPresenter.selectHeroInCombat(h.id);
              if (this.state.combat.selectedHeroId === h.id) {
                this.hudView.appendLog(`\u0412\u044B\u0431\u0440\u0430\u043D \u0431\u043E\u0435\u0446 <span class="hl-gold">${h.name}</span>. \u041D\u0430\u0441\u0442\u0440\u043E\u0439 \u0435\u0433\u043E \u0440\u0430\u0441\u043F\u043E\u0440\u044F\u0434\u043E\u043A \u0430\u0442\u0430\u043A \u0438 \u0446\u0435\u043B\u0435\u0439 \u043D\u0438\u0436\u0435!`, "ally");
              }
              return;
            }
          }
          this.state.combat.enemies.forEach((en, idx) => {
            if (en.hp > 0 && Math.abs(mx - en.x) < 28 && Math.abs(my - en.y) < 32) {
              this.state.combat.focusEnemyIndex = idx;
              this.state.addFloatingText("\u0424\u041E\u041A\u0423\u0421!", en.x, en.y - 25, "#ffd700");
              this.hudView.appendLog(`\u041E\u0442\u0440\u044F\u0434 \u0444\u043E\u043A\u0443\u0441\u0438\u0440\u0443\u0435\u0442 \u0443\u0434\u0430\u0440\u044B \u043D\u0430 \u0446\u0435\u043B\u0438: <span class="hl-gold">${en.name}</span>!`, "ally");
              this.hudView.renderCombatControls(this.state);
            }
          });
        }
      };
      canvas.addEventListener("click", (e) => {
        handleCanvasTap(e.clientX, e.clientY);
      });
      canvas.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) {
          const t = e.touches[0];
          const rect = canvas.getBoundingClientRect();
          const mx = (t.clientX - rect.left) * (canvas.width / rect.width);
          const my = (t.clientY - rect.top) * (canvas.height / rect.height);
          if (this.state.scene === "guild") {
            this.state.hoveredHotspot = null;
            for (const h of this.state.guildHotspots) {
              if (this.canvasView.hitTestHotspot(h, mx, my, this.state)) {
                this.state.hoveredHotspot = h;
                break;
              }
            }
          }
        }
      }, { passive: true });
    }
    bindWindowActions() {
      const w = window;
      w.openSquadModal = (id) => this.squadPresenter.openSquadModal(id || null);
      w.closeSquadModal = () => this.squadPresenter.closeSquadModal();
      w.renderSquadListModal = () => this.squadPresenter.renderSquadListModal();
      w.renderHeroDetailModal = (id) => this.squadPresenter.renderHeroDetailModal(id);
      w.toggleSquadHero = (id) => this.squadPresenter.toggleSquadHero(id);
      w.moveOrSwapSquadHero = (draggedId, zone, targetId) => this.squadPresenter.moveOrSwapSquadHero(draggedId, zone, targetId);
      w.selectHeroLeftInspect = (id, type, key) => this.squadPresenter.selectHeroLeftInspect(id, type, key);
      w.selectCompareBagItem = (id, idx) => this.squadPresenter.selectCompareBagItem(id, idx);
      w.selectHeroTalentNode = (id, tid) => this.squadPresenter.selectHeroTalentNode(id, tid);
      w.selectHeroStatusBadge = (id, skey) => this.squadPresenter.selectHeroStatusBadge(id, skey);
      w.equipItemOnHero = (id, idx) => this.squadPresenter.equipItemOnHero(id, idx);
      w.unequipHeroSlot = (id, slot) => this.squadPresenter.unequipHeroSlot(id, slot);
      w.unlockTalent = (id, tid) => this.squadPresenter.unlockTalent(id, tid);
      w.resetHeroTalents = (id) => this.squadPresenter.resetHeroTalents(id);
      w.enterGuild = (showSummary) => this.guildPresenter.enterGuild(!!showSummary);
      w.inspectBattleLoot = (idx) => this.guildPresenter.inspectBattleLoot(idx);
      w.openClinicDialog = () => this.guildPresenter.openClinicDialog();
      w.openHostDialog = (speech) => this.guildPresenter.openHostDialog(speech || null);
      w.switchHostTab = (tab) => this.guildPresenter.switchHostTab(tab);
      w.selectHostArmorItem = (id) => this.guildPresenter.selectHostArmorItem(id);
      w.buyHostArmorItem = (id) => this.guildPresenter.buyHostArmorItem(id);
      w.selectHostUpgrade = (id) => this.guildPresenter.selectHostUpgrade(id);
      w.buyTavernUpgrade = (id) => this.guildPresenter.buyTavernUpgrade(id);
      w.selectHostConsumable = (id) => this.guildPresenter.selectHostConsumable(id);
      w.buyShopItem = (type) => this.guildPresenter.buyShopItem(type);
      w.treatHeroInClinic = (idx, mode) => this.guildPresenter.treatHeroInClinic(idx, mode);
      w.hireMercenary = (idx) => this.guildPresenter.hireMercenary(idx);
      w.selectRecruiterCampaign = (idx) => this.guildPresenter.selectRecruiterCampaign(idx);
      w.toggleHeroWarPick = (id) => this.guildPresenter.toggleHeroWarPick(id);
      w.assignHeroToWarSlot = (heroId, campIdx, slotIdx) => this.guildPresenter.assignHeroToWarSlot(heroId, campIdx, slotIdx);
      w.removeHeroFromWarSlot = (heroId) => this.guildPresenter.removeHeroFromWarSlot(heroId);
      w.dispatchHeroesToWar = (campIdx) => this.guildPresenter.dispatchHeroesToWar(campIdx);
      w.toggleHeroMissionPick = (id) => this.guildPresenter.toggleHeroMissionPick(id);
      w.toggleWarTrackerPopup = (ev) => this.guildPresenter.toggleWarTrackerPopup(ev);
      w.closeWarTrackerPopup = (ev) => this.guildPresenter.closeWarTrackerPopup(ev);
      w.toggleClinicTrackerPopup = (ev) => this.guildPresenter.toggleClinicTrackerPopup(ev);
      w.closeClinicTrackerPopup = (ev) => this.guildPresenter.closeClinicTrackerPopup(ev);
      w.openSmithDialog = (speech) => this.guildPresenter.openSmithDialog(speech || null);
      w.setSmithRecipeFilter = (filter) => this.guildPresenter.setSmithRecipeFilter(filter);
      w.smeltSpareItem = (idx) => this.guildPresenter.smeltSpareItem(idx);
      w.craftSmithRecipe = (recipeId) => this.guildPresenter.craftSmithRecipe(recipeId);
      w.startQuest = (questId) => this.combatPresenter.startQuest(questId);
      w.confirmMapEncounter = () => this.combatPresenter.confirmMapEncounter();
      w.togglePause = () => this.combatPresenter.togglePause();
      w.usePsaKrev = () => this.combatPresenter.usePsaKrev();
      w.selectHeroInCombat = (id) => this.combatPresenter.selectHeroInCombat(id);
      w.cycleHeroSkillOrder = (id) => this.combatPresenter.cycleHeroSkillOrder(id);
      w.cycleHeroTargetRule = (id) => this.combatPresenter.cycleHeroTargetRule(id);
      w.useMasterBeer = () => this.combatPresenter.useMasterBeer();
      w.useMasterPot = () => this.combatPresenter.useMasterPot();
      w.returnFromCombat = () => this.combatPresenter.returnFromCombat();
    }
    start() {
      this.guildPresenter.enterGuild();
      const loop = () => {
        this.state.frame++;
        if (this.state.scene === "map") {
          this.combatPresenter.updateMapLogic();
        } else if (this.state.scene === "combat") {
          if (this.state.combat.active && !this.state.combat.paused) {
            this.state.combat.tickTimer++;
            if (this.state.combat.tickTimer >= 55) {
              this.state.combat.tickTimer = 0;
              this.combatPresenter.executeNextCombatTurn();
            }
          }
        }
        this.canvasView.renderFrame(this.state);
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    }
  };

  // src/main.ts
  function bootstrapGame() {
    const state = new GameStateModel();
    const canvasView = new CanvasRendererView("view", state.guildHotspots);
    const topBarView = new TopStatsBarView();
    const squadModalView = new SquadAndHeroModalView();
    const npcModalView = new GuildNpcModalView();
    const combatHudView = new CombatHudView();
    const squadPresenter = new SquadPresenter(state, squadModalView, topBarView, combatHudView);
    const guildPresenter = new GuildPresenter(state, npcModalView, topBarView, combatHudView, squadPresenter);
    const combatPresenter = new CombatPresenter(state, topBarView, combatHudView, guildPresenter);
    const gameLoopPresenter = new GameLoopPresenter(
      state,
      canvasView,
      combatHudView,
      squadPresenter,
      guildPresenter,
      combatPresenter
    );
    gameLoopPresenter.start();
  }
  bootstrapGame();
})();

</script>
