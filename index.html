<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bratrstvo Korbele: Богемия</title>
<meta name="description" content="2D RPG и Auto-battler игра в сеттинге средневековой Богемии." />
<meta property="og:title" content="Bratrstvo Korbele: Богемия" />
<meta property="og:description" content="2D RPG и Auto-battler игра в сеттинге средневековой Богемии." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />

<body>

<div id="game-container">
    <div id="stats-bar">
        <div class="stat-box" id="st-gold">Гроши: 60</div>
        <div class="stat-box" id="st-squad">Отряд: 3/5</div>
        <div class="stat-box" id="st-reserve">Резерв: 0/15</div>
        <div class="stat-box" id="st-cycle">Цикл: 1</div>
        <button class="btn-top-squad" onclick="openSquadModal()">🛡️ ОТРЯД</button>
    </div>
    
    <div id="viewport-container">
        <canvas id="view" width="520" height="290"></canvas>
    </div>

    <div id="log-container"></div>
    <div id="controls"></div>

    <!-- МОДАЛЬНОЕ ОКНО ОТРЯДА, КУКЛЫ ГЕРОЯ И ДИАЛОГОВ НПС -->
    <div id="modal-overlay">
        <div class="modal-box" id="modal-content"></div>
    </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
